name: hr-agency-api

# Telemetry of every .NET host. OtelEndpoint is empty unless the observability profile is on
# (./start.sh --observability sets it), and an empty endpoint means no exporter at all - the
# services run the same either way. Metrics every 5 s to match the Prometheus scrape interval.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OtelEndpoint:-}
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  Observability__ConsoleFormat: json

services:
  # ===================
  # Infrastructure
  # ===================
  postgres:
    image: postgres:17
    shm_size: 256mb
    container_name: hr-agency-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_app
      POSTGRES_USER: hr_app
      POSTGRES_PASSWORD: hr_app
    command: 
      - postgres 
      - -c 
      - max_connections=100
      - -c 
      - shared_preload_libraries=pg_stat_statements
      # All statements incl. nested ones, plus read/write time per query - the top queries panels.
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_app -d hr_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inner-cluster-communication           
  rustfs:
    image: rustfs/rustfs:latest
    container_name: hr-agency-api-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RustFsAccessKey}
      RUSTFS_SECRET_KEY: ${RustFsSecretKey}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: true
    volumes:
      - files_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: "10s"
    networks:
      - inner-cluster-communication  
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
        - mailpit:/data
    ports:
        - 8025:8025
        - 465:1025
    environment:
        MP_MAX_MESSAGES: 5000
        MP_DATABASE: /data/mailpit.db
        MP_SMTP_AUTH_ACCEPT_ANY: 0
        MP_SMTP_AUTH_ALLOW_INSECURE: 1     
        MP_SMTP_AUTH: mailer:mailer
    networks:
      - inner-cluster-communication
  rabbitmq:
    image: rabbitmq:4-management
    container_name: hr-agency-api-rabbitmq
    # Pinned: the node name is rabbit@<hostname> and the data dir is derived from it,
    # so an auto-generated hostname would orphan the volume on every recreate.
    hostname: hr-agency-api-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMqUser}
      RABBITMQ_DEFAULT_PASS: ${RabbitMqPassword}
      # Must match RabbitMq:VHost used by the API (amqp://.../development).
      RABBITMQ_DEFAULT_VHOST: development
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Replaces the image's own list, so management/prometheus must be repeated here.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: "30s"
    networks:
      - inner-cluster-communication
  webapi:
    build:
      context: ../
      dockerfile: ./Dockerfile
    container_name: hr-agency-api    
    networks:
      - inner-cluster-communication   
    deploy:
      replicas: ${ApiReplicaCount:-1}          
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      <<: *otel-env
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=hr_app;Username=hr_app;Password=hr_app;Maximum Pool Size=50"
      Jwt__Issuer: "hr-agency-api"
      Jwt__Audience: "hr-agency"
      Jwt__SecretKey: ${SecretKey}
      RustFs__Endpoint: "http://hr-agency-api-s3:9000"
      RustFs__AccessKey: ${RustFsAccessKey}
      RustFs__SecretKey: ${RustFsSecretKey}
      # The public job board (web, :5050) - prepended to every apply url in the generated feeds.
      # Not the agency panel on :8080, which has no page for a candidate.
      Application__FeedUrl: "http://localhost:5050"
      # Base of the reset password link that goes out in a mail - must point at the front, not the api.
      Application__PortalUrl: "http://localhost:8080"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: ${RabbitMqUser}
      RabbitMq__Password: ${RabbitMqPassword}
      RabbitMq__VHost: "/development"
      RabbitMq__MailExchange: "x.emails"      
      FileService__BaseUrl: "http://hr-agency-file-service:8080"
      FileService__Secret: ${FileServiceSecret}
      HR_AGENCY_EMAIL: ${HrAgencyEmail:-admin@hr-agency.com}
      HR_AGENCY_PASSWORD: ${HrAgencyPassword}
      Reports__BaseUrl: "http://hr-agency-reports-service:8080"
      Reports__Secret: ${ReportsSecret}
      Cors: ${Cors}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: "10s"      
    restart: on-failure      
    ports:
    - "5000:8080"
    depends_on:      
      postgres:
        condition: service_healthy   
      rabbitmq:
        condition: service_healthy
  file-service:
    build:
      context: ../
      dockerfile: ./Dockerfile.file-service
    container_name: hr-agency-file-service
    networks:
      - inner-cluster-communication
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      <<: *otel-env
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=hr_app;Username=hr_app;Password=hr_app;Maximum Pool Size=10"
      # Must match webapi - one shared key, and deliberately not the one user tokens are signed with.
      FileService__Secret: ${FileServiceSecret}
      RustFs__Endpoint: "http://hr-agency-api-s3:9000"
      RustFs__AccessKey: ${RustFsAccessKey}
      RustFs__SecretKey: ${RustFsSecretKey}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: "10s"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
  reports-service:
    build:
      context: ../
      dockerfile: ./Dockerfile.reports-service
    container_name: hr-agency-reports-service
    networks:
      - inner-cluster-communication
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      <<: *otel-env
      ASPNETCORE_HTTP_PORTS: 8080
      # Reads the `reports` schema only; the API's projections create and fill it.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=hr_app;Username=hr_app;Password=hr_app;Maximum Pool Size=10"
      # Must match webapi - its own key, neither the user token key nor the file service's.
      Reports__Secret: ${ReportsSecret}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: "10s"
    restart: on-failure
    ports:
    - "5200:8080"
    depends_on:
      postgres:
        condition: service_healthy
  feeds-worker:
    build:
      context: ../
      dockerfile: ./Dockerfile.feeds-worker
    container_name: hr-agency-feeds-worker
    networks:
      - inner-cluster-communication
    environment:
      DOTNET_ENVIRONMENT: docker
      <<: *otel-env
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=hr_app;Username=hr_app;Password=hr_app;Maximum Pool Size=10"
      RustFs__Endpoint: "http://hr-agency-api-s3:9000"
      RustFs__AccessKey: ${RustFsAccessKey}
      RustFs__SecretKey: ${RustFsSecretKey}
      # Must match webapi - this value is prepended to every apply url in the generated feeds.
      Application__FeedUrl: "http://localhost:5050"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      # Not a functional dependency: the API owns schema creation, the worker runs with AutoCreate.None.
      webapi:
        condition: service_healthy
  emails-worker:
    build:
      context: ../
      dockerfile: ./Dockerfile.notification-worker
    # No container_name: the service scales, and a fixed name would break every replica but the first.
    networks:
      - inner-cluster-communication
    deploy:
      replicas: ${EmailsWorkerReplicaCount:-1}
    environment:
      DOTNET_ENVIRONMENT: docker
      <<: *otel-env
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=hr_app;Username=hr_app;Password=hr_app;Maximum Pool Size=10"
      # Must match webapi - producer and consumers share one topology description.
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: ${RabbitMqUser}
      RabbitMq__Password: ${RabbitMqPassword}
      RabbitMq__VHost: "/development"
      RabbitMq__MailExchange: "x.emails"
      MailProvider: "mailkit"
      Smtp__Host: "mailpit"
      Smtp__Port: 1025
      Smtp__UseSsl: false
      Smtp__Username: mailer
      Smtp__Password: mailer
      Smtp__FromEmail: "no-reply@hr-agency.com"
      Smtp__FromName: "HR Agency Portal"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  web:
    build:
      context: ../
      dockerfile: ./Dockerfile.web
    container_name: hr-agency-web
    networks:
      - inner-cluster-communication
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      <<: *otel-env
      # No connection string on purpose: the public job board reaches the system only through
      # the API's internal routes, with a service key. The default is the key the seeder writes
      # (/api/development/seed), so a seeded stack works without touching .env; on anything
      # else issue one in the owner panel (Admin -> API keys) and set WebApiKey. In a real
      # deployment the key would come from a secret store (Vault, Key Vault), not a default.
      InternalApi__BaseUrl: "http://hr-agency-api:8080"
      InternalApi__ApiKey: ${WebApiKey:-sk_dev_public_job_board_seeded_key_not_a_secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: "10s"
    # Bounded: with a malformed key the board refuses to start, and an endless restart loop
    # would only bury that message.
    restart: "on-failure:3"
    ports:
    - "5050:8080"
    depends_on:
      webapi:
        condition: service_healthy
  front:
    build:
      context: ../frontend
    container_name: hr-agency-front  
    deploy:
      replicas: ${FrontReplicaCount:-1}      
    ports:
    - "8080:3000"
    environment:      
      API_URL: http://hr-agency-api:8080
    networks:
      - inner-cluster-communication
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: "10s"      
    restart: on-failure           
    depends_on:      
      webapi:
        condition: service_healthy                       

  # ===================
  # Observability (opt-in: ./start.sh --observability, i.e. the "observability" profile)
  # ===================
  #   every .NET host ──OTLP──▶ otel-collector ─┬─ logs + traces ──▶ rootprint ──▶ quickwit ──S3──▶ rustfs
  #                                              └─ metrics :8889 ◀── prometheus ──▶ grafana
  #   rabbitmq :15692, postgres-exporter :9187  ◀── prometheus
  #
  # Defaults below are local learning-project values; override them in .env (see .env-sample).
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: hr-agency-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      rootprint-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - rootprint_bootstrap:/bootstrap:ro
    ports:
      # For hosts started with `dotnet run` - launchSettings point them at localhost:4317.
      - "4317:4317"
      - "4318:4318"
    networks:
      - inner-cluster-communication

  prometheus:
    image: prom/prometheus:latest
    container_name: hr-agency-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - inner-cluster-communication

  grafana:
    image: grafana/grafana:latest
    container_name: hr-agency-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GrafanaUser:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GrafanaPassword:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hr-agency-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Read by the datasource provisioning: where "Open trace in Rootprint" points.
      ROOTPRINT_PUBLIC_URL: ${RootprintPublicUrl:-http://localhost:8282}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - inner-cluster-communication

  # Server-side PostgreSQL metrics. The services' own view of their SQL (Npgsql client metrics)
  # comes through the collector with everything else.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: hr-agency-postgres-exporter
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.query_length=200
      - --collector.stat_statements.limit=50
      - --collector.long_running_transactions
      - --collector.stat_activity_autovacuum
      - --collector.postmaster
    environment:
      DATA_SOURCE_URI: postgres:5432/hr_app?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${PostgresExporterPassword:-postgres-exporter-local}
    networks:
      - inner-cluster-communication

  # One-shot and repeatable: Rootprint's database, the exporter's role, pg_stat_statements.
  postgres-init:
    image: postgres:17
    container_name: hr-agency-postgres-init
    profiles: ["observability"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-observability.sh"]
    environment:
      PGUSER: hr_app
      PGPASSWORD: hr_app
      PGDATABASE: hr_app
      ROOTPRINT_DB_PASSWORD: ${RootprintDbPassword:-rootprint-local}
      POSTGRES_EXPORTER_PASSWORD: ${PostgresExporterPassword:-postgres-exporter-local}
    volumes:
      - ./observability/postgres/init-observability.sh:/init-observability.sh:ro
    networks:
      - inner-cluster-communication

  # Logs and traces: a UI over Quickwit, which keeps every index in S3.
  rootprint:
    image: ghcr.io/rootprint/rootprint:latest
    container_name: hr-agency-rootprint
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      quickwit:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rootprint:${RootprintDbPassword:-rootprint-local}@postgres:5432/rootprint
      QUICKWIT_URL: http://quickwit:7280
      ORIGIN: ${RootprintPublicUrl:-http://localhost:8282}
    ports:
      - "8282:8282"
    healthcheck:
      # The image has no curl or wget, but it has bun.
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:8282/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inner-cluster-communication

  # Creates the Rootprint admin and an ingest key once, and hands the key to the collector.
  rootprint-bootstrap:
    image: curlimages/curl:latest
    container_name: hr-agency-rootprint-bootstrap
    profiles: ["observability"]
    user: "0"
    restart: "no"
    depends_on:
      rootprint:
        condition: service_healthy
    environment:
      ROOTPRINT_ORIGIN: ${RootprintPublicUrl:-http://localhost:8282}
      ROOTPRINT_ADMIN_EMAIL: ${RootprintAdminEmail:-admin@hr-agency.com}
      ROOTPRINT_ADMIN_PASSWORD: ${RootprintAdminPassword:-rootprint-admin-local}
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./observability/rootprint/bootstrap.sh:/bootstrap.sh:ro
      - rootprint_bootstrap:/bootstrap
    networks:
      - inner-cluster-communication

  # Rootprint's search engine. Metastore and index splits live in the observability bucket.
  quickwit:
    image: quickwit/quickwit:v0.9.0
    container_name: hr-agency-quickwit
    profiles: ["observability"]
    restart: unless-stopped
    command: ["run"]
    depends_on:
      observability-bucket:
        condition: service_completed_successfully
    environment:
      QW_CONFIG: /quickwit/config/quickwit.yaml
      QW_DISABLE_TELEMETRY: "1"
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${ObservabilityBucket:-observability-logs}
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${RustFsAccessKey}
      AWS_SECRET_ACCESS_KEY: ${RustFsSecretKey}
      AWS_REGION: us-east-1
    volumes:
      - ./observability/rootprint/quickwit.yaml:/quickwit/config/quickwit.yaml:ro
      - quickwit_data:/quickwit/qwdata # local cache and write-ahead queue only
    healthcheck:
      test: ["CMD-SHELL", 'bash -c "echo > /dev/tcp/localhost/7280"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inner-cluster-communication

  # The bucket for logs and traces on the stack's RustFS - its own, apart from documents and feeds.
  observability-bucket:
    image: curlimages/curl:latest
    container_name: hr-agency-observability-bucket
    profiles: ["observability"]
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${RustFsAccessKey}
      S3_SECRET_KEY: ${RustFsSecretKey}
      S3_BUCKET: ${ObservabilityBucket:-observability-logs}
      S3_REGION: us-east-1
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    volumes:
      - ./observability/rustfs/create-bucket.sh:/create-bucket.sh:ro
    networks:
      - inner-cluster-communication

networks:
  inner-cluster-communication:

volumes:
  postgres_data:
  files_data:
  mailpit:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  quickwit_data:
  rootprint_bootstrap:
