name: hr-agency-infra
services:
  # ===================
  # Infrastructure
  # ===================
  postgres:
    image: postgres:17
    shm_size: 256mb
    container_name: hr-agency-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_app
      POSTGRES_USER: hr_app
      POSTGRES_PASSWORD: hr_app
    command: 
      - postgres 
      - -c 
      - max_connections=100
      - -c 
      - shared_preload_libraries=pg_stat_statements     
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_app -d hr_app"]
      interval: 5s
      timeout: 5s
      retries: 10
  rustfs:
    image: rustfs/rustfs:latest
    container_name: hr-agency-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: true
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - files_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: "10s"            

  rabbitmq:
    image: rabbitmq:4-management
    container_name: hr-agency-rabbitmq
    # Pinned: the node name is rabbit@<hostname> and the data dir is derived from it,
    # so an auto-generated hostname would orphan the volume on every recreate.
    hostname: hr-agency-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: hr_app
      RABBITMQ_DEFAULT_PASS: hr_app
      # Must match RabbitMq:VHost used by the API (amqp://.../development).
      RABBITMQ_DEFAULT_VHOST: development
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: "30s"

volumes:
  postgres_data:
  files_data:
  rabbitmq_data:
