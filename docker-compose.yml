name: hr-agency-infra
services:
  # ===================
  # Infrastructure
  # ===================
  postgres:
    image: postgres:17
    shm_size: 256mb
    container_name: hr-agency-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_app
      POSTGRES_USER: hr_app
      POSTGRES_PASSWORD: hr_app
    command: 
      - postgres 
      - -c 
      - max_connections=100
      - -c 
      - shared_preload_libraries=pg_stat_statements     
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_app -d hr_app"]
      interval: 5s
      timeout: 5s
      retries: 10
  rustfs:
    image: rustfs/rustfs:latest
    container_name: hr-agency-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: true
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - files_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: "10s"            

  rabbitmq:
    image: rabbitmq:4-management
    container_name: hr-agency-rabbitmq
    # Pinned: the node name is rabbit@<hostname> and the data dir is derived from it,
    # so an auto-generated hostname would orphan the volume on every recreate.
    hostname: hr-agency-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: hr_app
      RABBITMQ_DEFAULT_PASS: hr_app
      # Must match RabbitMq:VHost used by the API (amqp://.../development).
      RABBITMQ_DEFAULT_VHOST: development
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Replaces the image's own list, so management/prometheus must be repeated here.
      - ./infrastructure/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: "30s"

  mailpit:
    image: axllent/mailpit
    container_name: hr-agency-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data

  # ===================
  # Observability (opt-in: docker compose --profile aspire|grafana up -d)
  # ===================
  # A plain OTLP receiver with a UI - it does not need the solution to be an Aspire project.
  # Everything is kept in memory: restarting the container empties it, which is the point of a
  # scratchpad. The OTLP listeners are moved to the standard 4317/4318 so that the apps point at
  # the same port whichever backend is running.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5
    container_name: hr-agency-aspire-dashboard
    profiles: ["aspire"]
    restart: unless-stopped
    environment:
      ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL: "http://0.0.0.0:4317"
      ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: "http://0.0.0.0:4318"
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "18888:18888"
      - "4317:4317"
      - "4318:4318"

  # Grafana with Loki (logs), Tempo (traces), Prometheus (metrics) and an OTLP collector in front,
  # all in one image. Unlike the Aspire dashboard it keeps its data (volume) and has dashboards:
  # the HR Agency folder is provisioned from infrastructure/grafana. Opt-in, and exclusive with
  # the aspire profile - both take 4317/4318.
  grafana:
    image: grafana/otel-lgtm:0.33.1
    container_name: hr-agency-grafana
    profiles: ["grafana"]
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - grafana_data:/data
      - ./infrastructure/grafana/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./infrastructure/grafana/provisioning/hr-agency-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/hr-agency-dashboards.yaml:ro
      - ./infrastructure/grafana/dashboards:/otel-lgtm/hr-agency-dashboards:ro

volumes:
  postgres_data:
  files_data:
  rabbitmq_data:
  mailpit_data:
  grafana_data:
